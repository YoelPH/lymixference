# Define some default directories, which can then be used
# in the pipeline file `dvc.yaml`.
general:
  # NOTE FOR REPRODUCTION: when changing the number of components K,
  # you MUST update all fields marked with "CHANGE WHEN SWITCHING K".
  data: data/filtered_2.csv  # CHANGE WHEN SWITCHING K (must match data/filtered_<K>.csv)
  data_folder: data
  metrics: metrics.json
  plots_dir: plots
  history_dir: histories/2  # CHANGE WHEN SWITCHING K (must match histories/<K>)
data:
  # CHANGE WHEN SWITCHING K (locations included in the filtered dataset)
  # K=2: oral_cavity oropharynx
  # K=3: oral_cavity oropharynx hypopharynx
  # K=4: oral_cavity oropharynx hypopharynx larynx
  locations: oral_cavity oropharynx

########################################################################################
# This dictionary defines which LNLs are present in the
# graph and how they are connected.
graph:
  tumor:
    primary: [I, II, III, IV, V]
  lnl:
    I: [II]
    II: [III]
    III: [IV]
    IV: [V]
    V: []


########################################################################################
# Below are some parameters necessary for the model setup:
model:
  class: Unilateral             # model class to use (see `lymph-model` docs)
  side: ipsi
  distributions:                # marginalize over diagnosis times. Keys are T-stages
    early:
      frozen: binomial
      max_time: 10
      kwargs: {p: 0.3}
    late:
      parametric: binomial
      max_time: 10
  num_components: 2  # CHANGE WHEN SWITCHING K
  likelihood_tolerance: 0.01
  kwargs:

modalities:
  CT: [0.76, 0.81]
  MRI: [0.63, 0.81]
  PET: [0.86, 0.79]
  FNA: [0.98, 0.80]
  diagnostic_consensus: [0.86, 0.81]
  pathology: [1.0, 1.0]
  pCT: [0.86, 0.81]
  max_llh: [1.0, 1.0]

# these of the above modalities will be used to compute things
# like the naive maximum likelihood estimate of the true hidden
# state `max_llh`, or the `rank` "modality".
# The wird nested way of writing them down here is so that DVC can unpack the dict
# directly into the command.
data_cleaning_modalities:
  modalities:
  - CT
  - MRI
  - PET
  - FNA
  - diagnostic_consensus
  - pathology
  - pCT

# this lists the above defined modalities that will be used for
# inference and evaluation.
# The wird nested way of writing them down here is so that DVC can unpack the dict
# directly into the command.
inference_modalities:
  max_llh: [1.0, 1.0]
fitting:
  folder_path: histories/2/original_fit  # CHANGE WHEN SWITCHING K (must match histories/<K>/original_fit)
sampling:
  n_bootstraps: 200
  folder_path: data/bootstrap_2  # CHANGE WHEN SWITCHING K (must match data/bootstrap_<K>)
  output_path: histories/2/resampling  # CHANGE WHEN SWITCHING K (must match histories/<K>/resampling)
  starting_points: histories/2/original_fit/optimal_params.csv  # CHANGE WHEN SWITCHING K

em:
  seed: 42
