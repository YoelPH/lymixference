  plot-comp-uncert:
    wdir: .
    desc:
      Plot uncertainty in mixture components from bootstrapped refitting
    cmd: >
      lyscripts plot mixture_comp_uncertainty
      --optimal_params ${fitting.folder_path}/optimal_params.csv
      --input ${sampling.output_path}/optimal_params
      --output ${general.plots_dir}/mixture_comp_uncertainty_${model.num_components}_comp.png
