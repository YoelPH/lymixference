vars:
- params.yaml

stages:
  join:
    wdir: .
    desc: Concatenate any number of datasets so they can be used as one for training
    vars:
    - output: data/joined_2_test.csv
    cmd: >
      lyscripts data join
      --inputs 2021-usz-oropharynx/data.csv 2021-clb-oropharynx/data.csv 2023-isb-multisite/data.csv 2023-clb-multisite/data.csv 2024-hvh-oropharynx/data.csv data/UMC.csv data/USZ2.csv
      --output ${output}
    deps:
    - 2021-usz-oropharynx/data.csv
    - 2021-clb-oropharynx/data.csv
    - 2023-isb-multisite/data.csv
    - 2023-clb-multisite/data.csv
    - 2024-hvh-oropharynx/data.csv
    - data/UMC.csv
    - data/USZ2.csv
    outs:
    - ${output}

  enhance:
    wdir: .
    desc:
      This stage fixes the super- and sub-level reporting for the LNLs and also creates
      new 'modalities' from combining existing ones, e.g. using the logical AND or
      estimating the most likely involvement based on the observations only.
    vars:
    - input: data/joined_2_test.csv
    - output: data/enhanced_2_test.csv
    cmd: >
      lyscripts data enhance ${input} ${output} ${data_cleaning_modalities}
    deps:
    - ${input}
    params:
    - modalities
    outs:
    - ${output}

  filter:
    wdir: .
    desc:
      Select patients with oral cavity, oropharynx, hypopharynx and larynx subsites.
      Further reduce the ICD codes.
    cmd: >
      python scripts/filter_and_reduce.py
      --locations ${data.locations}
      --input data/enhanced_2_test.csv
      --output data/filtered_2_test.csv
    deps:
      - scripts/filter_and_reduce.py
      - data/enhanced_2_test.csv
    params:
    - general
    outs:
      - data/filtered_2_test.csv

  fitting:
    wdir: .
    desc:
      Fit mixture model 
    cmd: >
      lyscripts mixture_fit -i ${general.data}
    deps:
    - ${general.data}
    outs:
    - ${fitting.folder_path}
    params:
    - graph
    - model
    - em
    - modalities
    - general

  plot-mixture-matrix:
    wdir: .
    desc: Plots the mixture component matrix.
    cmd: >
      lyscripts plot mixture_plot
      --input ${fitting.folder_path}/mixture_coef.csv
      --output ${general.plots_dir}/mixture_matrix_2_comp_test.png
    deps:
    - ${fitting.folder_path}
    plots:
    - ${general.plots_dir}/mixture_matrix_2_comp_test.png
    - ${general.plots_dir}/mixture_matrix_2_comp_test.svg

  plot-simplex:
    wdir: .
    desc: Plots the simplex representation of the mixture coefficients
    cmd: >
      lyscripts plot simplex_plot
      --input ${fitting.folder_path}/mixture_coef.csv
      --output ${general.plots_dir}/simplex_2_comp_test.png
    deps:
    - ${fitting.folder_path}
    plots:
    - ${general.plots_dir}/simplex_2_comp_test.png
    - ${general.plots_dir}/simplex_2_comp_test.svg
    params:
    - general

  bootstrap:
    wdir: .
    cmd: >
      lyscripts data bootstrap 
      --output ${sampling.folder_path}
      --input ${general.data}
    deps:
    - ${general.data}
    outs:
    - ${sampling.folder_path}
    params:
    - sampling

  refitting:
    wdir: .
    desc:
      Re-fit mixture model on bootstrapped data
    cmd: >
      lyscripts mixture_fit -m True -sp ${sampling.starting_points} -i ${sampling.folder_path}
    deps:
    - ${sampling.folder_path}
    params:
    - sampling
    - graph
    - model
    - em
    - modalities
    - general
    - data
    outs:
    - ${sampling.output_path}
